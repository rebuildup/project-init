name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n script/link script/check script/test script/bootstrap script/secrets-doctor script/with-secrets script/check-secrets script/test-workflow script/agent/minimax script/agent/mimo home/.local/bin/agent config/agent-init.bash
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Test symlink behavior
        run: ./script/test
      - name: Test bootstrap and Infisical workflow
        run: ./script/test-workflow
      - name: Validate agent launcher config
        run: |
          bun script/agent.ts check
          bun script/agent.ts list > /dev/null
          bun script/agent.ts models zen > /dev/null
          bun script/agent.ts models opencode-go > /dev/null
          bun script/agent.ts shortcuts > /dev/null
      - name: Test agent launcher (mock harnesses)
        run: bun test script/agent.test.ts script/claude-settings.test.ts
      - name: Guard secret material
        run: ./script/check-secrets

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Validate agent launcher config (Windows)
        run: bun script/agent.ts check
      - name: Test Windows layers (batch shims, .cmd shortcuts, PowerShell wrapper)
        run: bun test script/agent.test.ts script/agent.windows.test.ts script/agent.entrypoint.windows.test.ts
      - name: Test Windows link adapter (adoption-first symlinks)
        run: bun test script/link.windows.test.ts
