name: eval-controls
on:
  pull_request:
    paths:
      - 'evals/**'
      - 'docs/adr/**'
      - 'templates/quality/**'
      - 'templates/agent-routing/**'
      - 'skills/**'
      - 'organization/**'
      - 'catalog/**'
      - '.claude/skills/**'
      - 'skills-lock.json'
      - 'PROMPT.ja.md'
      - 'scripts/**'
      - 'mise.toml'
      - 'package.json'
      - 'tsconfig.json'
      - 'orca.yaml'
      - '.config/**'
      - '.gitattributes'
      - '.github/workflows/eval-controls.yml'
  push:
    branches: [main, 'release-*']
jobs:
  deterministic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install TypeScript tooling
        run: bun install --no-save
      - name: Typecheck TypeScript scripts
        run: bun run typecheck
      - name: Test adaptive scheduler
        run: bun run test:adaptive
      - name: Test TypeScript release batching controls
        run: bun run test:release-batching
      - name: Test TypeScript interaction and Linear controls
        run: |
          bun run test:interaction
          bun run test:linear
      - name: Test TypeScript comparative controls
        run: bun evals/policy-evaluation/comparative-controls.mts
      - name: Test delegated agent routing
        run: node --test templates/agent-routing/dispatch.test.mts
      - name: Run deterministic controls
        shell: bash
        run: |
          set +e
          failed=0
          bun evals/policy-evaluation/controls.mts || failed=1
          for suite in \
            skills-cli-materialization; do
            echo "::group::evals/$suite"
            bash "evals/$suite/controls.sh"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=Eval failure::$suite returned exit $rc"
              failed=1
            fi
          done
          exit "$failed"
