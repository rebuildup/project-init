name: eval-controls
on:
  pull_request:
  push:
    branches: [main, 'release-*']
jobs:
  deterministic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install TypeScript tooling
        run: bun install --frozen-lockfile
      - name: Typecheck TypeScript scripts
        run: bun run typecheck
      - name: Ensure shell analysis is available
        run: shellcheck --version
      - name: Check whole-repository analysis and references
        run: bun run quality:structure
      - name: Check workflow gate honesty
        run: node scripts/quality/check-gate-honesty.mts workflow .github/workflows/eval-controls.yml
      - name: Test quality checks and challenge executor
        run: bun run test:system-quality
      - name: Challenge actual repository checks
        run: bun run quality:challenge
      - name: Test adaptive scheduler
        run: bun run test:adaptive
      - name: Test review regressions
        run: bun run test:eval-regressions
      - name: Test TypeScript release batching controls
        run: bun run test:release-batching
      - name: Test TypeScript interaction and Linear controls
        run: |
          bun run test:interaction
          bun run test:linear
      - name: Test canonical requirement handoff grader
        run: node --test evals/policy-evaluation/requirement-handoff.test.mts
      - name: Test delivery-status classification and CLI safety
        run: bun run test:delivery-status
      - name: Test TypeScript comparative controls
        run: bun evals/policy-evaluation/comparative-controls.mts
      - name: Test delegated agent routing
        run: node --test templates/agent-routing/dispatch.test.mts
      - name: Test role-aware Herdr layout
        run: node --test templates/agent-routing/layout.test.mts
      - name: Test Herdr dispatcher with mocked CLI
        run: node --test templates/agent-routing/dispatch.integration.test.mts
      - name: Test delegation ownership and failure regressions
        run: node --test templates/agent-routing/routing-regressions.test.mts
      - name: Test project-local routing materialization
        run: node --test templates/agent-routing/materialize.test.mts
      - name: Test dedicated Supervisor boundary
        run: bun run test:supervisor-boundary
      - name: Run deterministic controls
        shell: bash
        run: |
          set +e
          failed=0
          bun evals/policy-evaluation/controls.mts || failed=1
          for suite in \
            skills-cli-materialization; do
            echo "::group::evals/$suite"
            bash "evals/$suite/controls.sh"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=Eval failure::$suite returned exit $rc"
              failed=1
            fi
          done
          exit "$failed"
